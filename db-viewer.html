<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库查看</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .db-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .db-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .db-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .db-title i {
            font-size: 32px;
            color: white;
        }

        .db-title h1 {
            font-size: 28px;
            color: white;
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .back-btn, .logout-btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .back-btn:hover, .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .logout-btn {
            background: rgba(231, 76, 60, 0.2);
            border-color: rgba(231, 76, 60, 0.5);
            color: rgba(231, 76, 60, 0.9);
        }

        .logout-btn:hover {
            background: rgba(231, 76, 60, 0.3);
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 16px;
            text-align: center;
            min-width: 140px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .data-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex: 1;
        }

        .section-title {
            color: white;
            font-size: 18px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            padding: 40px 20px;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .user-card, .log-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid rgba(102, 126, 234, 0.5);
            transition: all 0.3s ease;
        }

        .user-card:hover, .log-card:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .user-card.admin {
            border-left-color: rgba(46, 204, 113, 0.8);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-name {
            color: white;
            font-weight: 600;
            font-size: 15px;
        }

        .user-role {
            padding: 6px 14px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 500;
        }

        .role-admin {
            background: rgba(46, 204, 113, 0.3);
            color: rgba(46, 204, 113, 0.9);
        }

        .role-user {
            background: rgba(102, 126, 234, 0.3);
            color: rgba(102, 126, 234, 0.9);
        }

        .card-info {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 6px;
        }

        .card-info strong {
            color: rgba(255, 255, 255, 0.8);
        }

        .log-action {
            color: white;
            font-weight: 600;
            font-size: 15px;
        }

        .log-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .logs-container {
            max-height: 400px;
            overflow-y: auto;
        }

        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            white-space: pre-wrap;
            font-family: 'Consolas', 'Monaco', monospace;
            margin: 0;
        }

        .raw-section {
            max-height: 400px;
            overflow-y: auto;
        }

        .copy-btn {
            float: right;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .copy-btn.copied {
            background: rgba(46, 204, 113, 0.3);
            border-color: rgba(46, 204, 113, 0.5);
        }

        @media (max-width: 768px) {
            .stats-bar {
                justify-content: center;
            }
            
            .stat-item {
                min-width: 120px;
                padding: 15px 20px;
            }
            
            .stat-value {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="background-image"></div>
    <div class="background-overlay"></div>
    
    <div class="db-container">
        <div class="db-header">
            <div class="db-title">
                <i class="fas fa-database"></i>
                <h1>数据库查看</h1>
            </div>
            <div class="header-actions">
                <a href="dashboard.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i>
                    返回控制台
                </a>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    退出登录
                </button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="userCount">0</div>
                <div class="stat-label">用户总数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="adminCount">0</div>
                <div class="stat-label">管理员数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="logCount">0</div>
                <div class="stat-label">日志数</div>
            </div>
        </div>

        <div class="data-section">
            <h2 class="section-title"><i class="fas fa-users"></i> 用户列表</h2>
            <div id="usersList">
                <div class="empty-state">
                    <i class="fas fa-users"></i>
                    <p>暂无用户数据</p>
                </div>
            </div>
        </div>

        <div class="data-section">
            <h2 class="section-title"><i class="fas fa-file-alt"></i> 操作日志</h2>
            <div class="logs-container" id="logsList">
                <div class="empty-state">
                    <i class="fas fa-file-alt"></i>
                    <p>暂无操作日志</p>
                </div>
            </div>
        </div>

        <div class="data-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 class="section-title"><i class="fas fa-code"></i> 原始数据</h2>
                <button class="copy-btn" onclick="copyRawData()" id="copyBtn">
                    <i class="fas fa-copy"></i> 复制
                </button>
            </div>
            <div class="raw-section">
                <pre id="rawData"></pre>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!isAdmin()) {
                alert('您没有权限访问此页面');
                window.location.href = 'index.html';
                return;
            }
            loadData();
        });

        function isAdmin() {
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) return false;
            try {
                const user = JSON.parse(currentUser);
                return user && user.isAdmin === true;
            } catch (e) {
                return false;
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function loadData() {
            Promise.all([
                fetch('/api/users').then(res => res.json()),
                fetch('/api/logs').then(res => res.json()),
                fetch('/api/wallpapers').then(res => res.json())
            ]).then(([usersRes, logsRes, wallpapersRes]) => {
                const users = usersRes.success ? usersRes.users : [];
                const logs = logsRes.success ? logsRes.logs : [];
                const wallpapers = wallpapersRes.success ? wallpapersRes.wallpapers : [];

                document.getElementById('userCount').textContent = users.length;
                document.getElementById('adminCount').textContent = users.filter(u => u.isAdmin === 1).length;
                document.getElementById('logCount').textContent = logs.length;

                if (users.length === 0) {
                    document.getElementById('usersList').innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-users"></i>
                            <p>暂无用户数据</p>
                        </div>
                    `;
                } else {
                    document.getElementById('usersList').innerHTML = users.map(user => `
                        <div class="user-card ${user.isAdmin === 1 ? 'admin' : ''}">
                            <div class="card-header">
                                <span class="user-name">${user.username}</span>
                                <span class="user-role ${user.isAdmin === 1 ? 'role-admin' : 'role-user'}">
                                    ${user.isAdmin === 1 ? '管理员' : '普通用户'}
                                </span>
                            </div>
                            <div class="card-info"><strong>邮箱:</strong> ${user.email || '未设置'}</div>
                            <div class="card-info"><strong>注册时间:</strong> ${formatDate(user.createdAt)}</div>
                            <div class="card-info"><strong>ID:</strong> ${user.id}</div>
                        </div>
                    `).join('');
                }

                if (logs.length === 0) {
                    document.getElementById('logsList').innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-file-alt"></i>
                            <p>暂无操作日志</p>
                        </div>
                    `;
                } else {
                    document.getElementById('logsList').innerHTML = logs.slice(0, 20).map(log => `
                        <div class="log-card">
                            <div class="card-header">
                                <span class="log-action">${log.action}</span>
                                <span class="log-time">${formatDate(log.timestamp)}</span>
                            </div>
                            <pre>${typeof log.details === 'string' ? log.details : JSON.stringify(log.details, null, 2)}</pre>
                        </div>
                    `).join('');

                    if (logs.length > 20) {
                        document.getElementById('logsList').innerHTML += `
                            <div style="text-align: center; color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                                仅显示最近20条日志，共 ${logs.length} 条
                            </div>
                        `;
                    }
                }

                const rawData = JSON.stringify({
                    users: users,
                    logs: logs,
                    wallpapers: wallpapers.length,
                    currentUser: localStorage.getItem('currentUser') ? JSON.parse(localStorage.getItem('currentUser')) : null
                }, null, 2);
                document.getElementById('rawData').textContent = rawData;
            }).catch(err => {
                console.error('加载数据失败:', err);
            });
        }

        function copyRawData() {
            const rawData = document.getElementById('rawData').textContent;
            navigator.clipboard.writeText(rawData).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerHTML = '<i class="fas fa-check"></i> 已复制';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> 复制';
                    copyBtn.classList.remove('copied');
                }, 2000);
            });
        }

        function logout() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('rememberedUsername');
            localStorage.removeItem('rememberMe');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
