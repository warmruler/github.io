<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - 登录</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div class="background-image"></div>
    <div class="background-overlay"></div>
    
    <div class="container">
        <div class="login-card">
            <div class="brand">
                <i class="fas fa-user-circle" id="brandIcon"></i>
                <h1 id="brandTitle">个人主页</h1>
            </div>
            <h2 id="welcomeTitle">欢迎回来</h2>
            <p id="welcomeSubtitle">请登录您的账户</p>
            <form id="loginForm" autocomplete="off">
                <div class="input-group">
                    <input type="text" id="username" placeholder="用户名" required autocomplete="username">
                    <label for="username">用户名</label>
                    <i class="fas fa-user icon-left"></i>
                </div>
                <div class="input-group password">
                    <input type="password" id="password" placeholder="密码" required autocomplete="new-password">
                    <label for="password">密码</label>
                    <i class="fas fa-lock icon-left"></i>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('password')"></i>
                </div>
                <div class="error-message" id="errorMessage"></div>
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">记住我</label>
                </div>
                <button type="submit" class="login-btn">
                    <span>登录</span>
                </button>
                <div class="success-message" id="successMessage"></div>
            </form>
            <div class="links">
                <a href="#">忘记密码?</a>
                <a href="register.html">注册账户</a>
            </div>
            <div class="admin-login-hint" id="adminLoginHint">
                <span>管理员登录：</span>
                <a href="#" onclick="fillAdminCredentials()">点击使用管理员账户登录</a>
            </div>
            <div class="user-login-hint" id="userLoginHint" style="display: none;">
                <span>普通用户登录：</span>
                <a href="#" onclick="restoreUserLogin()">返回普通登录</a>
            </div>
            <div class="login-success-panel" id="loginSuccessPanel" style="display: none;">
                <div class="success-content">
                    <i class="fas fa-check-circle success-icon"></i>
                    <h3>登录成功!</h3>
                    <p id="welcomeMessage"></p>
                    <button class="logout-btn" onclick="logout()">退出登录</button>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-customizer">
        <button class="bg-customizer-btn" onclick="toggleBgCustomizer()">
            <i class="fas fa-image"></i>
        </button>
        <div class="bg-customizer-panel" id="bgPanel">
            <h4>自定义背景</h4>
            <div class="bg-options">
                <div class="bg-option active" data-bg="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&h=1080&fit=crop">
                    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=80&h=80&fit=crop" alt="背景1">
                </div>
                <div class="bg-option" data-bg="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1920&h=1080&fit=crop">
                    <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=80&h=80&fit=crop" alt="背景2">
                </div>
                <div class="bg-option" data-bg="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&h=1080&fit=crop">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=80&h=80&fit=crop" alt="背景3">
                </div>
                <div class="bg-option" data-bg="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920&h=1080&fit=crop">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=80&h=80&fit=crop" alt="背景4">
                </div>
                <div class="bg-option" data-bg="https://images.unsplash.com/photo-1518770660439-4636190af475?w=1920&h=1080&fit=crop">
                    <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=80&h=80&fit=crop" alt="背景5">
                </div>
                <div class="bg-option" data-bg="https://images.unsplash.com/photo-1488590528505-98d2b5aba04b?w=1920&h=1080&fit=crop">
                    <img src="https://images.unsplash.com/photo-1488590528505-98d2b5aba04b?w=80&h=80&fit=crop" alt="背景6">
                </div>
            </div>
            <input type="text" class="bg-url-input" id="bgUrlInput" placeholder="输入自定义背景图片URL">
            <button class="bg-apply-btn" onclick="applyCustomBg()">应用自定义背景</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
