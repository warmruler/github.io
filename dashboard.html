<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理控制台</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .dashboard-header h1 {
            font-size: 32px;
            color: white;
            margin-bottom: 10px;
        }

        .dashboard-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .dashboard-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .card-icon {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.5), rgba(118, 75, 162, 0.5));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 32px;
            color: white;
        }

        .dashboard-card h3 {
            color: white;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .dashboard-card p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            line-height: 1.5;
        }

        .dashboard-footer {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logout-btn {
            padding: 10px 30px;
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.5);
            border-radius: 25px;
            color: rgba(231, 76, 60, 0.9);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(231, 76, 60, 0.3);
            color: rgba(231, 76, 60, 1);
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .mini-stat {
            text-align: center;
        }

        .mini-stat-value {
            font-size: 24px;
            font-weight: 700;
            color: white;
        }

        .mini-stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="background-image"></div>
    <div class="background-overlay"></div>
    
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1><i class="fas fa-shield-alt"></i> 管理控制台</h1>
            <p>欢迎回来，管理员</p>
        </div>

        <div class="stats-row" id="statsRow">
            <div class="mini-stat">
                <div class="mini-stat-value" id="userCount">0</div>
                <div class="mini-stat-label">用户总数</div>
            </div>
            <div class="mini-stat">
                <div class="mini-stat-value" id="logCount">0</div>
                <div class="mini-stat-label">操作日志</div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-card" onclick="goToLogs()">
                <div class="card-icon">
                    <i class="fas fa-file-alt"></i>
                </div>
                <h3>操作日志</h3>
                <p>查看所有用户操作记录，包括登录、注册等活动</p>
            </div>
            <div class="dashboard-card" onclick="goToAdmin()">
                <div class="card-icon">
                    <i class="fas fa-users"></i>
                </div>
                <h3>用户管理</h3>
                <p>管理系统用户，查看用户列表，进行用户管理操作</p>
            </div>
            <div class="dashboard-card" onclick="goToDbViewer()">
                <div class="card-icon">
                    <i class="fas fa-database"></i>
                </div>
                <h3>数据库查看</h3>
                <p>查看所有数据库内容，包括原始数据和统计信息</p>
            </div>
        </div>

        <div class="dashboard-footer">
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> 退出登录
            </button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!isAdmin()) {
                alert('您没有权限访问此页面');
                window.location.href = 'index.html';
                return;
            }
            
            updateStats();
        });

        function updateStats() {
            const users = getUsers();
            const logs = getLogs();
            
            document.getElementById('userCount').textContent = users.length;
            document.getElementById('logCount').textContent = logs.length;
        }

        function goToLogs() {
            window.location.href = 'logs.html';
        }

        function goToAdmin() {
            window.location.href = 'admin.html';
        }

        function goToDbViewer() {
            window.location.href = 'db-viewer.html';
        }

        function logout() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('rememberedUsername');
            localStorage.removeItem('rememberMe');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
