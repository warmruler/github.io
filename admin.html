<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员面板</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .admin-container-full {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-title i {
            font-size: 32px;
            color: white;
        }

        .admin-title h1 {
            font-size: 28px;
            color: white;
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .back-btn, .logout-btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .back-btn:hover, .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .logout-btn {
            background: rgba(231, 76, 60, 0.2);
            border-color: rgba(231, 76, 60, 0.5);
            color: rgba(231, 76, 60, 0.9);
        }

        .logout-btn:hover {
            background: rgba(231, 76, 60, 0.3);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .tab-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: rgba(102, 126, 234, 0.5);
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .tab-content {
            display: none;
            flex: 1;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .admin-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            flex: 1;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-input {
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            width: 250px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.5);
            background: rgba(255, 255, 255, 0.15);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .table-container {
            max-height: 450px;
            overflow-y: auto;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-weight: 600;
            font-size: 13px;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        td {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-danger {
            background: rgba(231, 76, 60, 0.3);
            color: white;
        }

        .btn-danger:hover {
            background: rgba(231, 76, 60, 0.5);
        }

        .btn-primary {
            background: rgba(102, 126, 234, 0.5);
            color: white;
        }

        .btn-primary:hover {
            background: rgba(102, 126, 234, 0.7);
        }

        .btn-success {
            background: rgba(46, 204, 113, 0.3);
            color: white;
        }

        .btn-success:hover {
            background: rgba(46, 204, 113, 0.5);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 16px;
        }

        .system-info {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .system-info h4 {
            color: white;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .system-info p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .danger-section {
            background: rgba(231, 76, 60, 0.1);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .danger-section h4 {
            color: rgba(231, 76, 60, 0.9);
            margin-bottom: 15px;
            font-size: 15px;
        }

        .danger-btn {
            padding: 12px 25px;
            border: 1px solid rgba(231, 76, 60, 0.5);
            border-radius: 10px;
            background: rgba(231, 76, 60, 0.2);
            color: rgba(231, 76, 60, 0.9);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
        }

        .danger-btn:hover {
            background: rgba(231, 76, 60, 0.3);
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-admin {
            background: rgba(102, 126, 234, 0.3);
            color: rgba(102, 126, 234, 0.9);
        }

        .badge-user {
            background: rgba(46, 204, 113, 0.3);
            color: rgba(46, 204, 113, 0.9);
        }
    </style>
</head>
<body>
    <div class="background-image"></div>
    <div class="background-overlay"></div>
    
    <div class="admin-container-full">
        <div class="admin-header">
            <div class="admin-title">
                <i class="fas fa-users"></i>
                <h1>管理员面板</h1>
            </div>
            <div class="header-actions">
                <a href="dashboard.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i>
                    返回控制台
                </a>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    退出登录
                </button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="users">用户管理</button>
            <button class="tab-btn" data-tab="system">系统设置</button>
        </div>

        <div class="admin-content">
            <div class="tab-content active" id="usersTab">
                <div class="action-bar">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索用户名或邮箱..." onkeyup="searchUsers()">
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalUsers">0</div>
                        <div class="stat-label">总用户数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="adminUsers">0</div>
                        <div class="stat-label">管理员数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="normalUsers">0</div>
                        <div class="stat-label">普通用户</div>
                    </div>
                </div>

                <div class="table-container" id="usersTable">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>邮箱</th>
                                <th>角色</th>
                                <th>注册时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="6">
                                    <div class="empty-state">
                                        <i class="fas fa-users"></i>
                                        <p>暂无用户数据</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="tab-content" id="systemTab">
                <div class="system-info">
                    <h4><i class="fas fa-info-circle"></i> 系统信息</h4>
                    <p><strong>数据存储:</strong> 浏览器本地存储 (LocalStorage)</p>
                    <p><strong>用户总数:</strong> <span id="sysUserCount">0</span></p>
                    <p><strong>日志总数:</strong> <span id="sysLogCount">0</span></p>
                    <p><strong>当前时间:</strong> <span id="currentTime"></span></p>
                </div>

                <div class="danger-section">
                    <h4><i class="fas fa-exclamation-triangle"></i> 危险操作</h4>
                    <button class="danger-btn" onclick="clearAllUsers()">清空所有用户</button>
                    <button class="danger-btn" onclick="clearAllLogs()">清空所有日志</button>
                    <button class="danger-btn" onclick="clearAllData()">清空全部数据</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!isAdmin()) {
                alert('您没有权限访问此页面');
                window.location.href = 'index.html';
                return;
            }
            loadUsers();
            updateSystemInfo();
            updateCurrentTime();
        });

        function updateCurrentTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString('zh-CN');
        }

        setInterval(updateCurrentTime, 1000);

        function loadUsers() {
            const users = getUsers();
            const tableBody = document.querySelector('#usersTable tbody');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filteredUsers = users.filter(user => 
                user.username.toLowerCase().includes(searchTerm) ||
                user.email.toLowerCase().includes(searchTerm)
            );

            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('adminUsers').textContent = users.filter(u => u.isAdmin).length;
            document.getElementById('normalUsers').textContent = users.filter(u => !u.isAdmin).length;
            document.getElementById('sysUserCount').textContent = users.length;
            document.getElementById('sysLogCount').textContent = getLogs().length;

            if (filteredUsers.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="fas fa-users"></i>
                                <p>${searchTerm ? '未找到匹配的用户' : '暂无用户数据'}</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = filteredUsers.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.username}</td>
                    <td>${user.email}</td>
                    <td><span class="badge ${user.isAdmin ? 'badge-admin' : 'badge-user'}">${user.isAdmin ? '管理员' : '普通用户'}</span></td>
                    <td>${formatDate(user.createdAt)}</td>
                    <td>
                        ${user.username !== 'admin' ? `
                            <button class="btn btn-danger" onclick="deleteUser(${user.id})">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                            <button class="btn ${user.isAdmin ? 'btn-danger' : 'btn-success'}" onclick="toggleAdmin(${user.id})">
                                <i class="fas fa-${user.isAdmin ? 'user-minus' : 'user-plus'}"></i>
                                ${user.isAdmin ? '取消管理员' : '设为管理员'}
                            </button>
                        ` : '<span style="color: rgba(255,255,255,0.5); font-size: 12px;">系统管理员</span>'}
                    </td>
                </tr>
            `).join('');
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function searchUsers() {
            loadUsers();
        }

        function deleteUser(userId) {
            if (confirm('确定要删除此用户吗？此操作无法撤销。')) {
                let users = getUsers();
                users = users.filter(u => u.id !== userId);
                saveUsers(users);
                loadUsers();
            }
        }

        function toggleAdmin(userId) {
            let users = getUsers();
            const user = users.find(u => u.id === userId);
            if (user) {
                user.isAdmin = !user.isAdmin;
                saveUsers(users);
                loadUsers();
            }
        }

        function clearAllUsers() {
            if (confirm('确定要清空所有用户吗？此操作无法撤销！系统管理员 admin 会被保留。')) {
                let users = getUsers();
                users = users.filter(u => u.username === 'admin');
                saveUsers(users);
                loadUsers();
            }
        }

        function clearAllLogs() {
            if (confirm('确定要清空所有日志吗？此操作无法撤销。')) {
                localStorage.removeItem('logs');
                document.getElementById('sysLogCount').textContent = '0';
            }
        }

        function clearAllData() {
            if (confirm('确定要清空全部数据吗？此操作无法撤销！系统管理员 admin 会被保留。')) {
                localStorage.removeItem('logs');
                let users = getUsers();
                users = users.filter(u => u.username === 'admin');
                saveUsers(users);
                loadUsers();
            }
        }

        function updateSystemInfo() {
            document.getElementById('sysUserCount').textContent = getUsers().length;
            document.getElementById('sysLogCount').textContent = getLogs().length;
        }

        function logout() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('rememberedUsername');
            localStorage.removeItem('rememberMe');
            window.location.href = 'index.html';
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                this.classList.add('active');
                document.getElementById(this.dataset.tab + 'Tab').classList.add('active');
                
                if (this.dataset.tab === 'system') {
                    updateSystemInfo();
                }
            });
        });
    </script>
</body>
</html>
